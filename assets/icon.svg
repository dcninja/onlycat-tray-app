<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Cat head -->
  <circle cx="16" cy="18" r="11" fill="#f5a623"/>
  <!-- Left ear -->
  <polygon points="6,10 9,3 13,10" fill="#f5a623"/>
  <!-- Right ear -->
  <polygon points="19,10 23,3 26,10" fill="#f5a623"/>
  <!-- Inner left ear -->
  <polygon points="7.5,9 9.5,4.5 12,9" fill="#f9c97c"/>
  <!-- Inner right ear -->
  <polygon points="20,9 22.5,4.5 24.5,9" fill="#f9c97c"/>
  <!-- Face -->
  <circle cx="16" cy="18" r="9" fill="#f9c97c"/>
  <!-- Left eye -->
  <ellipse cx="12.5" cy="16" rx="1.8" ry="2.2" fill="#2c2c2c"/>
  <!-- Right eye -->
  <ellipse cx="19.5" cy="16" rx="1.8" ry="2.2" fill="#2c2c2c"/>
  <!-- Eye shine left -->
  <circle cx="13.2" cy="15.2" r="0.6" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="20.2" cy="15.2" r="0.6" fill="white"/>
  <!-- Nose -->
  <polygon points="16,19.5 14.8,21 17.2,21" fill="#e8748a"/>
  <!-- Mouth -->
  <path d="M14.8,21 Q16,22.5 17.2,21" stroke="#2c2c2c" stroke-width="0.6" fill="none"/>
  <!-- Whiskers left -->
  <line x1="7" y1="20" x2="13" y2="20.5" stroke="#2c2c2c" stroke-width="0.5"/>
  <line x1="7" y1="21.5" x2="13" y2="21.5" stroke="#2c2c2c" stroke-width="0.5"/>
  <!-- Whiskers right -->
  <line x1="19" y1="20.5" x2="25" y2="20" stroke="#2c2c2c" stroke-width="0.5"/>
  <line x1="19" y1="21.5" x2="25" y2="21.5" stroke="#2c2c2c" stroke-width="0.5"/>
</svg>
