<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' https://gateway.onlycat.com" />
  <title>OnlyCat — Recent Activity</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Recent Activity</h1>
    <div class="tabs">
      <button class="tab active" data-tab="video">Video Movement Events</button>
      <button class="tab" data-tab="all">All Events</button>
      <button class="tab" data-tab="unknown">Unknown Cats</button>
      <button class="tab" data-tab="favourites">⭐ Favourites</button>
    </div>
    <div class="search-bar">
      <input id="search-input" type="text" placeholder="Search by cat name..." autocomplete="off" />
      <button id="export-btn" title="Export visible events to CSV">📥 Export</button>
    </div>
    <div class="filters">
      <div class="filter-group-label">Event Classification</div>
      <label class="filter-label">
        <input type="checkbox" class="filter-check" data-classification="1" checked /> Entry Allowed
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-check" data-classification="3" checked /> Contraband Detected
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-check" data-classification="0" checked /> No Activity
      </label>
      <div class="filter-group-label">Event Summary Filters</div>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-direction="INWARD" checked /> 🢃 Inward
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-direction="OUTWARD" checked /> 🢁 Outward
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-action="TRANSIT" checked /> ✅ Transit
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-action="PEEK" checked /> 👀 Peek
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-action="DENY" checked /> ⛔ Deny
      </label>
      <label class="filter-label">
        <input type="checkbox" class="filter-summary" data-nosummary="true" checked /> No Summary
      </label>
    </div>
  </header>
  <main>
    <ul id="event-list"></ul>
    <div id="load-more-container">
      <button id="load-more-btn">Load More</button>
    </div>
    <p id="empty-msg" hidden>No events yet.</p>
  </main>
  <script type="module" src="renderer.js"></script>
</body>
</html>
